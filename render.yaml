services:
  - type: web
    name: multi-tenant-rag
    runtime: python
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p data
    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /